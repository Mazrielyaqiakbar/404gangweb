<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GANG CHAOS | Final Pure Frame</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Permanent+Marker&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --red: #FF0000;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --fg: #000000;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Manrope', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        @media (hover: hover) {
            * { cursor: none; }
        }

        /* ── SCROLL CONTAINER ── */
        .main-container {
            height: 100dvh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
        }

        /* ── SECTION BASE ── */
        .section {
            height: 100dvh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* ── NAV ── */
        .nav {
            position: fixed;
            top: max(20px, env(safe-area-inset-top, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            z-index: 200;
        }

        .nav-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid var(--fg);
            background: transparent;
            transition: background 0.25s, border-color 0.25s;
            display: block;
        }

        .nav-dot:hover {
            background: var(--red);
            border-color: var(--red);
        }

        /* ── HERO ── */
        .hero-section {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: var(--bg);
        }

        .hero-title {
            font-family: 'Permanent Marker', cursive;
            font-size: clamp(3rem, 18vw, 14rem);
            line-height: 0.88;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            z-index: 2;
            padding: 0 16px;
        }

        .hero-title span { color: var(--red); }

        .corner-text {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom, 24px));
            left: max(24px, env(safe-area-inset-left, 24px));
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.55rem, 2vw, 0.8rem);
            opacity: 0.45;
            letter-spacing: 0.05em;
        }

        /* ── SCROLL HINT ── */
        .scroll-hint {
            position: absolute;
            bottom: max(28px, env(safe-area-inset-bottom, 28px));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0.5;
            animation: bounce 2s ease-in-out infinite;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .scroll-hint span {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .scroll-arrow {
            width: 1px;
            height: 26px;
            background: var(--fg);
            position: relative;
        }

        .scroll-arrow::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 6px;
            height: 6px;
            border-right: 1px solid var(--fg);
            border-bottom: 1px solid var(--fg);
            transform: translateX(-50%) rotate(45deg);
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%       { transform: translateX(-50%) translateY(7px); }
        }

        /* ══════════════════════════════════════
           IMAGE SECTION — KUNCI UTAMA
        ══════════════════════════════════════ */
        .image-section {
            display: block;
            background: #111;
        }

        .image-section img {
            /* Pakai position absolute agar gambar tidak mempengaruhi ukuran container */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* cover = isi penuh layar, crop sisi berlebih */
            object-fit: cover;
            /* Fokus tengah — bisa diubah ke "top" jika foto penting di atas */
            object-position: center center;
            display: block;
            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.8s ease;
        }

        @media (hover: hover) {
            .image-section:hover img {
                transform: scale(1.03);
            }
        }

        /* ── FOOTER ── */
        .footer-section {
            background: #000;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
        }

        .footer-btn {
            font-family: 'Permanent Marker', cursive;
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            color: var(--red);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: transform 0.3s;
            -webkit-tap-highlight-color: transparent;
            display: inline-block;
        }

        .footer-btn:hover  { transform: scale(1.08); text-shadow: 0 0 20px rgba(255,0,0,0.4); }
        .footer-btn:active { transform: scale(0.95); }

        /* ── CURSOR (desktop only) ── */
        .cursor-dot {
            width: 10px;
            height: 10px;
            background: var(--red);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
            display: none;
        }

        @media (hover: hover) {
            .cursor-dot { display: block; }
        }

        body.hovering .cursor-dot {
            width: 48px;
            height: 48px;
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid var(--red);
        }

        /* ── MOBILE KHUSUS ── */
        @media (max-width: 768px) {
            /* Gambar portrait mobile — titik fokus lebih ke atas */
            .image-section img {
                object-position: center 20%;
            }
        }

        /* Landscape HP kecil */
        @media (max-height: 500px) and (orientation: landscape) {
            .image-section img {
                object-position: center center;
            }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor"></div>

    <nav class="nav" aria-label="Controls">
        <button class="nav-dot interactable" id="theme-toggle" aria-label="Toggle tema"></button>
    </nav>

    <div class="main-container" id="scroller">

        <!-- FRAME 1: HERO -->
        <section class="section hero-section">
            <h1 class="hero-title">GANG<br><span>CHAOS</span></h1>
            <div class="corner-text">© GANG CHAOS</div>
            <div class="scroll-hint" id="scroll-hint" aria-hidden="true">
                <span>scroll</span>
                <div class="scroll-arrow"></div>
            </div>
        </section>

        <!-- FRAME 2 -->
        <section class="section image-section">
            <img src="111gang.png" alt="Gang Chaos Collection 01">
        </section>

        <!-- FRAME 3 -->
        <section class="section image-section">
            <img src="22gang.png" alt="Gang Chaos Collection 02">
        </section>

        <!-- FRAME 4 -->
        <section class="section image-section">
            <img src="3.png" alt="Coming Soon">
        </section>

        <!-- FRAME 5 -->
        <section class="section image-section">
            <img src="4.png" alt="Coming Soon">
        </section>

        <!-- FRAME 6 -->
        <section class="section image-section">
            <img src="comingsoon.png" alt="Coming Soon">
        </section>

        <!-- FRAME 7: FOOTER -->
        <section class="section footer-section">
            <a href="#" class="footer-btn interactable">COLLAB NOW</a>
        </section>

    </div>

    <script>
        const cursor  = document.getElementById('cursor');
        const hint    = document.getElementById('scroll-hint');
        const scroller = document.getElementById('scroller');
        const html    = document.documentElement;

        // Cursor hanya aktif di perangkat dengan mouse
        if (window.matchMedia('(hover: hover)').matches) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top  = e.clientY + 'px';
            });
            document.querySelectorAll('.interactable, a, button').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        }

        // Theme toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
            html.setAttribute('data-theme',
                html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
            );
        });

        // Sembunyikan scroll hint setelah scroll pertama
        scroller.addEventListener('scroll', () => {
            if (hint) hint.style.opacity = '0';
        }, { once: true });
    </script>
</body>
</html>
